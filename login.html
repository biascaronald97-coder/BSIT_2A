<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDEX SYNDICATE — Manager Clearance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0d1315;
    --panel:#151d20;
    --panel-raised:#1c262a;
    --card:#d9d3bf;
    --card-dim:#c7c0a8;
    --teal:#49d6c0;
    --teal-dim:#276b61;
    --stamp:#a83f30;
    --bone:#e6e1d1;
    --bone-dim:#8d9592;
    --line: rgba(73,214,192,0.18);
    --error:#c85040;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:'IBM Plex Serif', serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    position:relative;
    overflow-x:hidden;
  }
  ::selection{ background:var(--teal); color:var(--void); }

  h1,h2,.display{ font-family:'Big Shoulders Display', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.08em; text-transform:uppercase; }
  a{ color:inherit; }

  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: repeating-linear-gradient(0deg, rgba(73,214,192,0.015) 0px, rgba(73,214,192,0.015) 1px, transparent 1px, transparent 3px);
  }
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 55% 45% at 80% 10%, rgba(73,214,192,0.10), transparent 60%),
      radial-gradient(ellipse 45% 40% at 8% 95%, rgba(168,63,48,0.08), transparent 60%);
  }

  .wrap{ position:relative; z-index:2; width:100%; max-width:440px; }

  /* ---- Emblem ---- */
  .emblem{
    width:82px; height:82px; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 0 16px rgba(73,214,192,0.45));
    animation:emblem-glow 4s ease-in-out infinite;
  }
  .emblem img{ width:100%; height:100%; object-fit:contain; }
  @keyframes emblem-glow{
    0%,100%{ filter:drop-shadow(0 0 12px rgba(73,214,192,0.32)); }
    50%{ filter:drop-shadow(0 0 22px rgba(73,214,192,0.58)); }
  }

  .doc-no{
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.3em; color:var(--teal);
    margin-bottom:8px;
  }
  .doc-no::before,.doc-no::after{ content:""; width:20px; height:1px; background:var(--teal); opacity:0.6; }

  h1{ text-align:center; font-size:2.4rem; color:var(--bone); margin-bottom:6px; }
  .lede{ text-align:center; font-style:italic; color:var(--bone-dim); font-size:0.98rem; margin-bottom:36px; }

  /* ---- Form card ---- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    padding:38px 34px 30px;
    position:relative;
  }
  .card::before{
    content:""; position:absolute; top:14px; right:14px; width:26px; height:26px;
    border:2px solid var(--stamp); border-radius:50%; opacity:0.5;
  }
  .card::after{
    content:"FORM 0-M"; position:absolute; top:20px; right:44px;
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.15em; color:var(--bone-dim); opacity:0.6;
  }

  .field{ margin-bottom:24px; }
  .field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--teal); margin-bottom:10px;
  }
  .input-row{ position:relative; display:flex; align-items:center; }
  .field input{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--bone); font-family:'IBM Plex Serif',serif; font-size:1.05rem; padding:10px 4px 12px;
    outline:none; transition:border-color 0.3s ease;
  }
  .field input::placeholder{ color:var(--bone-dim); opacity:0.5; font-style:italic; }
  .field input:focus{ border-color:var(--teal); }
  .field.focused label{ color:var(--teal); }
  .field .underline-fill{
    position:absolute; bottom:0; left:0; height:1px; width:0; background:var(--teal);
    transition:width 0.35s ease; box-shadow:0 0 6px rgba(73,214,192,0.6);
  }
  .field.focused .underline-fill{ width:100%; }

  .toggle-vis{
    position:absolute; right:4px; background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--bone-dim);
    padding:6px; transition:color 0.25s ease;
  }
  .toggle-vis:hover{ color:var(--teal); }

  .row-between{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:10px; }

  .check-wrap{ display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
  .check-wrap input{ display:none; }
  .check-box{
    width:18px; height:18px; border:1px solid var(--teal-dim); position:relative; flex-shrink:0;
    transition:border-color 0.25s ease, background 0.25s ease;
  }
  .check-wrap input:checked + .check-box{ background:var(--teal); border-color:var(--teal); }
  .check-box::after{
    content:""; position:absolute; left:5px; top:1px; width:5px; height:9px;
    border:solid var(--void); border-width:0 2px 2px 0; transform:rotate(45deg);
    opacity:0; transition:opacity 0.2s ease;
  }
  .check-wrap input:checked + .check-box::after{ opacity:1; }
  .check-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; color:var(--bone-dim); }

  .forgot{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; color:var(--teal-dim); text-decoration:none; border-bottom:1px dotted var(--teal-dim); }
  .forgot:hover{ color:var(--teal); border-color:var(--teal); }

  .btn{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.2em; text-transform:uppercase;
    padding:16px; border:1px solid var(--teal); background:var(--teal); color:var(--void); font-weight:600;
    cursor:pointer; transition:all 0.25s ease; position:relative; overflow:hidden;
  }
  .btn:hover{ background:var(--teal-dim); border-color:var(--teal-dim); color:var(--bone); }
  .btn:active{ transform:scale(0.99); }
  .btn .status{
    display:block; font-size:9px; letter-spacing:0.15em; margin-top:4px; opacity:0.7; font-weight:400;
  }

  .divider{ display:flex; align-items:center; gap:14px; margin:28px 0 22px; }
  .divider .ln{ flex:1; height:1px; background:var(--line); }
  .divider span{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.2em; color:var(--bone-dim); }

  .footnote{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--bone-dim); margin-top:24px; letter-spacing:0.05em; }
  .footnote a{ color:var(--teal); text-decoration:none; border-bottom:1px dotted var(--teal); }
  .footnote a:hover{ color:var(--bone); border-color:var(--bone); }

  .page-footer{
    text-align:center; margin-top:36px; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.15em; color:var(--bone-dim); opacity:0.6;
  }

  /* ---- status pulse line under emblem ---- */
  .pulse-line{
    display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:26px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.2em; color:var(--bone-dim);
  }
  .pulse-dot{ width:6px; height:6px; border-radius:50%; background:var(--teal); animation:blink 1.6s infinite; }
  @keyframes blink{ 0%,100%{ opacity:0.25; } 50%{ opacity:1; } }

  @media (max-width:480px){
    .card{ padding:30px 22px 24px; }
    h1{ font-size:2rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .emblem, .pulse-dot{ animation:none; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
</style>
</head>

    <div class="doc-no mono">Index Syndicate</div>
    <h1>Manager Clearance</h1>
    <p class="lede">State your ID and cipher. The Index will verify against its records before the elevator moves.</p>

    <div class="pulse-line"><div class="pulse-dot"></div>AWAITING SUBMISSION</div>

    <form class="card" id="loginForm" autocomplete="off">
      <div class="field" id="idField">
        <label for="managerId">Manager ID</label>
        <div class="input-row">
          <input type="text" id="managerId" name="managerId" placeholder="e.g. M-0091" required>
        </div>
        <div class="underline-fill"></div>
      </div>

      <div class="field" id="cipherField">
        <label for="cipher">Cipher</label>
        <div class="input-row">
          <input type="password" id="cipher" name="cipher" placeholder="••••••••" required>
          <button type="button" class="toggle-vis mono" id="toggleVis">SHOW</button>
        </div>
        <div class="underline-fill"></div>
      </div>

      <div class="row-between">
        <label class="check-wrap">
          <input type="checkbox" id="retain">
          <span class="check-box"></span>
          <span class="check-label">Retain Clearance</span>
        </label>
        <a href="#" class="forgot">Forgot Cipher?</a>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Request Clearance
        <span class="status" id="btnStatus">Form 0-M / Rev. 4</span>
      </button>

      <div class="divider"><div class="ln"></div><span>OR</span><div class="ln"></div></div>

      <p class="footnote">No case file on record? <a href="#">Petition for Enrollment</a></p>
    </form>

    <p class="page-footer">© INDEX SYNDICATE — FAN CONCEPT PAGE, UNOFFICIAL</p>
  </div>

<script>
  // focus states drive label color + underline fill
  document.querySelectorAll('.field input').forEach(input=>{
    const field = input.closest('.field');
    input.addEventListener('focus', ()=> field.classList.add('focused'));
    input.addEventListener('blur', ()=> { if(!input.value) field.classList.remove('focused'); });
  });

  // password visibility toggle
  const cipher = document.getElementById('cipher');
  const toggleVis = document.getElementById('toggleVis');
  toggleVis.addEventListener('click', ()=>{
    const isPw = cipher.type === 'password';
    cipher.type = isPw ? 'text' : 'password';
    toggleVis.textContent = isPw ? 'HIDE' : 'SHOW';
  });

  // submit -> simple processing feedback (no real backend)
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submitBtn');
  const btnStatus = document.getElementById('btnStatus');
  const pulseText = document.querySelector('.pulse-line');

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    btn.disabled = true;
    btnStatus.textContent = 'Verifying against case file…';
    pulseText.lastChild ? null : null;
    pulseText.childNodes[1].textContent = 'VERIFYING';
    setTimeout(()=>{
      btnStatus.textContent = 'Clearance pending manual review.';
      pulseText.childNodes[1].textContent = 'PENDING REVIEW';
      btn.disabled = false;
    }, 1400);
  });
</script>

</body>
</html>
